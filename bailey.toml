# Source folders, in sheet order.
[folders]
parts = "the only drawn art"
type = "Inter Tight ExtraBold, outlined"
marks = "parts and letters, placed"
tiles = "a square in the theme's ground colour, plus one mark"
lockups = "a part beside the word"
reference = "pairings kept for reference only"

# ink: the art. ground: a tile's square.
[themes.light]
ink = "#0B0E17"
ground = "#FFFFFF"

[themes.dark]
ink = "#F3F5FA"
ground = "#0B0E17"

# PNG sizes per folder: longest side, in pixels.
[png]
marks = [1024]
lockups = [1024]
tiles = [512, 180, 48, 32, 16]
